{% extends "base.html" %}

{% block title %}Create Account — FirstStep Careers{% endblock %}

{% block content %}
<div class="container auth-wrapper">
  <div class="auth-card" style="max-width: 580px;">
    <div class="auth-header">
      <h1 class="auth-title">Join FirstStep Careers</h1>
      <p class="auth-subtitle">Select your account type to begin finding jobs or hiring freshers.</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST" id="registerForm">
      <!-- Role Selection Cards -->
      <label class="form-label" style="text-align: left; margin-bottom: 0.75rem;">I want to register as: <span class="required">*</span></label>
      <div class="role-cards-grid">
        <label class="role-radio-label">
          <input type="radio" name="role" value="fresher" checked onchange="toggleCompanyField()">
          <div class="role-card-inner">
            <div class="role-icon">
              <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
              </svg>
            </div>
            <div class="role-name">College Fresher</div>
            <div class="role-desc">Looking for jobs & internships</div>
          </div>
        </label>

        <label class="role-radio-label">
          <input type="radio" name="role" value="recruiter" onchange="toggleCompanyField()">
          <div class="role-card-inner">
            <div class="role-icon">
              <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
              </svg>
            </div>
            <div class="role-name">Hiring Recruiter</div>
            <div class="role-desc">Post jobs & hire top graduates</div>
          </div>
        </label>
      </div>

      <div class="form-group">
        <label for="name" class="form-label">Full Name <span class="required">*</span></label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. John Doe" required value="{{ request.form.get('name', '') }}">
      </div>

      <div class="form-group" id="companyFieldGroup" style="display: none;">
        <label for="company_name" class="form-label">Company / Organization Name <span class="required">*</span></label>
        <input type="text" id="company_name" name="company_name" class="form-control" placeholder="e.g. Acme Tech Solutions" value="{{ request.form.get('company_name', '') }}">
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@college.edu or name@company.com" required value="{{ request.form.get('email', '') }}">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="regPassword" class="form-label">Password <span class="required">*</span></label>
          <div style="position: relative;">
            <input type="password" id="regPassword" name="password" class="form-control" placeholder="Min. 6 chars" required minlength="6">
            <button type="button" class="password-toggle-btn" data-target="regPassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password <span class="required">*</span></label>
          <div style="position: relative;">
            <input type="password" id="confirmPassword" name="confirm_password" class="form-control" placeholder="Repeat password" required minlength="6">
            <button type="button" class="password-toggle-btn" data-target="confirmPassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
        Complete Registration
      </button>

      <div style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="{{ url_for('login') }}" style="font-weight: 700;">Sign In</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function toggleCompanyField() {
  const isRecruiter = document.querySelector('input[name="role"]:checked').value === 'recruiter';
  const group = document.getElementById('companyFieldGroup');
  const input = document.getElementById('company_name');
  if (isRecruiter) {
    group.style.display = 'block';
    input.setAttribute('required', 'required');
  } else {
    group.style.display = 'none';
    input.removeAttribute('required');
  }
}
</script>
{% endblock %}
